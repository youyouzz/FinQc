[project]
name = "finqc"
version = "0.1.0"
description = "Private research system: macro, risk, strategies and AI on top of the TradeMaster engine"
requires-python = ">=3.12"
dependencies = [
  "trademaster",
]

[tool.uv.sources]
trademaster = { path = "TradeMaster", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finqc"]
